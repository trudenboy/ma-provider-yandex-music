# Auto-generated by ma-provider-tools — do not edit manually.
# Upstream-authored agent guidance distributed from ma-provider-tools is
# skipped by every hook (codespell, whitespace, EOF): its wording follows
# upstream's dictionary, not this repo's, and a fix belongs upstream.
exclude: ^(AGENTS\.md|\.github/copilot-instructions\.md|\.github/instructions/music-assistant-[^/]+\.md|\.claude/skills/ma-(review-pr|upstream-standards)/.*)$
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: 🐶 Ruff Linter
        language: system
        types: [python]
        files: ^(provider/.*\.py|tests/.*\.py)$
        # --ignore RUF100: keep reverse-synced noqa markers for rules this
        # repo's ruff.toml has not enabled yet (see reusable-test.yml).
        entry: uv run --active --no-project --with 'ruff>=0.15,<0.16' ruff check --fix --ignore RUF100
        require_serial: true
        stages: [pre-commit, pre-push, manual]

      - id: ruff-format
        name: 🐶 Ruff Formatter
        language: system
        types: [python]
        files: ^(provider/.*\.py|tests/.*\.py)$
        entry: uv run --active --no-project --with 'ruff>=0.15,<0.16' ruff format
        require_serial: true
        stages: [pre-commit, pre-push, manual]

      - id: check-ast
        name: 🐍 Check Python AST
        language: system
        types: [python]
        entry: uv run --active --no-project check-ast

      - id: check-case-conflict
        name: 🔠 Check for case conflicts
        language: system
        entry: uv run --active --no-project check-case-conflict

      - id: check-docstring-first
        name: ℹ️  Check docstring is first
        language: system
        types: [python]
        entry: uv run --active --no-project check-docstring-first

      - id: check-executables-have-shebangs
        name: 🧐 Check that executables have shebangs
        language: system
        types: [text, executable]
        entry: uv run --active --no-project check-executables-have-shebangs
        stages: [pre-commit, pre-push, manual]

      - id: check-json
        name: ｛ Check JSON files
        language: system
        types: [json]
        entry: uv run --active --no-project check-json
        files: ^(provider\/manifest.json)|(tests/fixtures/.+\.json)$

      - id: check-toml
        name: ✅ Check TOML files
        language: system
        types: [toml]
        entry: uv run --active --no-project check-toml

      - id: check-merge-conflict
        name: 💥 Check for merge conflicts
        language: system
        types: [text]
        entry: uv run --active --no-project check-merge-conflict

      - id: check-symlinks
        name: 🔗 Check for broken symlinks
        language: system
        types: [symlink]
        entry: uv run --active --no-project check-symlinks

      - id: codespell
        name: ✅ Check code for common misspellings
        language: system
        types: [text]
        entry: uv run --active --no-project codespell

      - id: detect-private-key
        name: 🕵️ Detect Private Keys
        language: system
        types: [text]
        entry: uv run --active --no-project detect-private-key

      - id: end-of-file-fixer
        name: ⮐ Fix End of Files
        language: system
        types: [text]
        entry: uv run --active --no-project end-of-file-fixer
        stages: [pre-commit, pre-push, manual]

      - id: no-commit-to-branch
        name: 🛑 Don't commit to main branch
        language: system
        entry: uv run --active --no-project no-commit-to-branch
        pass_filenames: false
        always_run: true
        args:
          - --branch=main

      - id: trailing-whitespace
        name: ✄ Trim Trailing Whitespace
        language: system
        types: [text]
        entry: uv run --active --no-project trailing-whitespace-fixer
        stages: [pre-commit, pre-push, manual]

      # Mirrors upstream music-assistant/server check_method_order (AGENTS.md:
      # private methods live at the bottom of each class) so the rule fails
      # here instead of at the first upstream PR (ma-provider-tools#115).
      - id: check-method-order
        name: 🔤 Check method order (private methods last)
        language: system
        entry: uv run --active --no-project python scripts/check_method_order.py
        pass_filenames: false
        files: ^(provider/.*\.py|scripts/check_method_order\.py)$

      # Upstream review rules no linter enforces (MA001-MA006: shared http
      # session, silent broad except, pre-formatted log messages, discarded
      # tasks, database access, unpinned requirements). Blocking; a deliberate
      # exception needs `# ma-allow: <CODE> <reason>` on (or directly above)
      # the reported line.
      - id: check-upstream-rules
        name: 🧭 Check upstream review rules (MA001-MA006)
        language: system
        entry: uv run --active --no-project python scripts/check_upstream_rules.py
        pass_filenames: false
        files: ^(provider/.*\.py|provider/manifest\.json|scripts/check_upstream_rules\.py)$

      - id: mypy
        name: 🔍 Mypy Type Checker
        entry: uv run --active --no-project mypy
        language: system
        types: [python]
        require_serial: true
        pass_filenames: false
